apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cluster-scoped and platform resources (gatewayclass.yaml, envoyproxy.yaml,
# clusterissuer.yaml) are applied separately - see README-deploy.md.
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - gateway.yaml
  - httproute.yaml
  - certmanager.yaml
